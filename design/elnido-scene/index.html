<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Nido Living Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&display=swap">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one full-bleed living photograph; a small time console floats bottom-right. Single dark look by choice. */
:root {
  --ink: #F4F6F5;
  --ink-dim: rgba(244,246,245,0.72);
  --glass: rgba(6,14,20,0.42);
  --line: rgba(244,246,245,0.28);
  --lagoon: #6FE3D2;
  --ground: #071017;
  --ui: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--ui); overflow: hidden; }
#poster, #gl, #birds { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#poster { background: var(--ground) center / cover no-repeat; }
#gl { opacity: 0; transition: opacity .8s ease; }
#gl.ready { opacity: 1; }
#birds { pointer-events: none; }
.console {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding: 10px 14px;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 12px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 13px;
}
.readout { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.readout b { font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.readout span { color: var(--ink-dim); font-variant-numeric: tabular-nums; font-size: 12px; }
#hour { width: 180px; max-width: 46vw; accent-color: var(--lagoon); }
.btn {
  font: 600 12px var(--ui); letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 12px; min-height: 36px; cursor: pointer;
}
.btn[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.btn:focus-visible, #hour:focus-visible { outline: 2px solid var(--lagoon); outline-offset: 2px; }
</style>
</head>
<body>

<div id="poster" aria-hidden="true"></div>
<canvas id="gl" aria-label="Animated view of the Big Lagoon in El Nido, Palawan, lit by the real sun and moon for the current time" role="img"></canvas>
<canvas id="birds" aria-hidden="true"></canvas>

<div class="console" role="group" aria-label="Scene time">
  <div class="readout" aria-live="polite">
    <b id="period">Day</b>
    <span id="clock">12:00 PM · your time</span>
  </div>
  <input id="hour" type="range" min="0" max="24" step="0.05" value="12" aria-label="Time of day">
  <button id="live" class="btn" aria-pressed="true" type="button">Live</button>
  <button id="play" class="btn" aria-pressed="false" type="button">Play a day</button>
</div>

      var sunC = [1.0, lerp(0.97, 0.62, lowS), lerp(0.88, 0.32, lowS)];
      var sunW = clamp01((sk.e + 1.5) / 3);
      gl.uniform4f(U.sun, sp[0], sp[1], sunR, sunW);
      gl.uniform3f(U.sunCol, sunC[0], sunC[1], sunC[2]);
      gl.uniform1f(U.warmth, clamp01((sk.e - 2) / 6) * clamp01((24 - sk.e) / 14) * 0.85);

      // Moon: today's phase on its nightly arc, faint by day
      var mpos = skyPos(sk.Hm, sk.em);
      // Moon appears only once the sun is down: fades in through dusk, gone before dawn
      var dark = clamp01((-sk.e - 1) / 6);
      var moonW = clamp01((sk.em + 1) / 3) * dark * dark * (3 - 2 * dark);
      // keep it in the open sky: it fades into the haze before it can reach the islands
      moonW *= 1 - clamp01((mpos[1] - 0.22) / 0.08);
      gl.uniform4f(U.moon, mpos[0], mpos[1], 0.03, moonW);
      gl.uniform1f(U.moonPhase, sk.phase);
      gl.uniform1f(U.stars, clamp01((-sk.e - 4) / 8));

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      if (!canvas.classList.contains('ready')) canvas.classList.add('ready');
      drawBirds(ms, reduce ? 0 : lerp(la.birds, lb.birds, f));
    }
    var lb2 = label(sk);
    if (lb2 !== lastLabel) { periodEl.textContent = lb2; lastLabel = lb2; }
    clockEl.textContent = fmt(h) + (state.playing ? ' · playing' : state.live ? ' · your time' : ' · preview');
    if (state.live || state.playing) hourIn.value = h.toFixed(2);
  }

  var raf = 0, running = false;
  function loop(ms) { frame(ms); raf = requestAnimationFrame(loop); }
  function start() { if (running || reduce) return; running = true; raf = requestAnimationFrame(loop); }
  function stop() { running = false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });

  Promise.all([load(s0.A), load(s0.B)]).then(function () {
    frame(performance.now());
    start();
    ['night', 'sunrise', 'day', 'sunset'].forEach(load);
    if (reduce) setInterval(function () { frame(performance.now()); }, 60000);
  });

  // ---------- controls ----------
  hourIn.addEventListener('input', function () {
    state.hour = parseFloat(hourIn.value); state.live = false; state.playing = false;
    liveBtn.setAttribute('aria-pressed', 'false'); playBtn.setAttribute('aria-pressed', 'false');
    if (reduce) frame(performance.now());
  });
  liveBtn.addEventListener('click', function () {
    state.live = true; state.playing = false;
    liveBtn.setAttribute('aria-pressed', 'true'); playBtn.setAttribute('aria-pressed', 'false');
    if (reduce) frame(performance.now());
  });
  playBtn.addEventListener('click', function () {
    if (state.playing) { state.hour = currentHour(performance.now()); state.playing = false; playBtn.setAttribute('aria-pressed', 'false'); return; }
    state.playFrom = parseFloat(hourIn.value); state.playStart = performance.now(); state.playing = true; state.live = false;
    playBtn.setAttribute('aria-pressed', 'true'); liveBtn.setAttribute('aria-pressed', 'false');
    if (reduce) { reduce = false; start(); }
  });

  function startUIOnly() { var s = sky(state.hour, Date.now()); periodEl.textContent = label(s); clockEl.textContent = fmt(state.hour) + ' · your time'; }
})();
</script>
